[project]
name = "ridesurge"
version = "1.0.0"
description = "Demand-adaptive dynamic pricing and revenue optimization system"
requires-python = ">=3.11"
dependencies = [
  "catboost>=1.2.8", "fastapi>=0.115", "joblib>=1.4",
  "matplotlib>=3.9", "numpy>=2.0", "pandas>=2.2",
  "scikit-learn>=1.5", "scipy>=1.13", "seaborn>=0.13",
  "shap>=0.46", "streamlit>=1.40", "uvicorn[standard]>=0.30"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]
